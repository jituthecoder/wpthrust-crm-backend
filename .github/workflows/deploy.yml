name: Deploy to Hostinger Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Hostinger Auto-Deployment Webhook
        run: |
          curl -s -S -f "https://api-crm.wpthrust.in/api/deploy-webhook?secret=wpthrust_crm_deploy_secret_2026"
